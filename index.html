<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jim Espelico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            padding: 20px;
            color: #fff;
        }

        .card {
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 28px;
            max-width: 380px;
            width: 100%;
            position: relative;
        }

        .amp-logo {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: -0.5px;
            margin-bottom: 36px;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 30px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Instrument Serif', serif;
        }

        .name {
            font-family: 'Instrument Serif', serif;
            font-size: 38px;
            font-weight: 400;
            color: #fff;
            letter-spacing: -0.5px;
            line-height: 1;
            margin-bottom: 6px;
        }

        .handle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
            margin-bottom: 28px;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
        }

        .socials {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .socials a {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .socials a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .socials svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .qr-section {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .qr-code {
            background: #fff;
            border-radius: 6px;
            padding: 6px;
            line-height: 0;
            flex-shrink: 0;
        }

        .qr-code canvas { display: block; }

        .qr-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            line-height: 1.5;
        }

        .save-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.2px;
        }

        .save-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="card">

    <div class="qr-section">
        <div class="qr-code">
            <canvas id="qrCanvas"></canvas>
        </div>
        <div class="qr-text">Scan to<br>open this card</div>
    </div>

    <button class="save-btn" onclick="saveContact()">Save Contact</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
    const CARD_URL = 'https://jimsteven.github.io/business-card/';

    function renderQR() {
        const canvas = document.getElementById('qrCanvas');
        if (window.QRCode && canvas) {
            QRCode.toCanvas(canvas, CARD_URL, {
                width: 88,
                margin: 0,
                color: { dark: '#000000', light: '#ffffff' }
            }, function (err) {
                if (err) console.error('QR error:', err);
            });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderQR);
    } else {
        renderQR();
    }

    function saveContact() {
        const vcard = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            'FN:Jim Espelico',
            'N:Espelico;Jim;;;',
            'TEL;TYPE=CELL:09669875456',
            'EMAIL:jim@ampcode.com',
            'URL:https://ampcode.com/@jimsteven',
            'URL:https://www.instagram.com/jim_the_explorer',
            'URL:https://www.linkedin.com/in/tasktamerpro',
            'END:VCARD'
        ].join('\n');

        const blob = new Blob([vcard], { type: 'text/vcard' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'jim_espelico.vcf';
        a.click();
        URL.revokeObjectURL(url);
    }
</script>
