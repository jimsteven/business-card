    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            padding: 20px;
            color: #fff;
        }

        .card {
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 28px;
            max-width: 380px;
            width: 100%;
            position: relative;
            text-align: center;
        }

        .amp-logo {
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 36px;
            text-align: left;
            line-height: 0;
        }

        .amp-logo svg {
            height: 22px;
            width: auto;
            display: inline-block;
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 10px auto 20px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 16px;
            box-sizing: border-box;
        }

        .avatar img {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .name {
            font-family: 'Instrument Serif', serif;
            font-size: 38px;
            font-weight: 400;
            color: #fff;
            letter-spacing: -0.5px;
            line-height: 1;
            margin-bottom: 6px;
        }

        .handle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
            margin-bottom: 28px;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
        }

        .socials {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .socials a {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .socials a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .socials svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .save-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.2px;
        }

        .save-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
