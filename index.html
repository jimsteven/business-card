    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { background: #000; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            color: #fff;
            overflow-x: hidden;
        }

        /* Faint drifting dust behind the card */
        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background-image:
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.35), transparent 60%),
                radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.25), transparent 60%),
                radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,.2), transparent 60%),
                radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,.3), transparent 60%);
            background-size: 220px 220px, 300px 300px, 380px 380px, 260px 260px;
            animation: dust 90s linear infinite;
            pointer-events: none;
            opacity: .5;
        }

        @keyframes dust { to { transform: translate3d(-220px, -300px, 0); } }

        .stage {
            perspective: 1100px;
            width: 100%;
            max-width: 380px;
            position: relative;
        }

        .shadow {
            position: absolute;
            left: 10%;
            right: 10%;
            bottom: -18px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(255,255,255,.07), transparent);
            filter: blur(6px);
            transform: translate3d(calc(var(--ry, 0) * -1px), 0, 0) scale(calc(1 - var(--lift, 0) * .12));
            opacity: calc(.9 - var(--lift, 0) * .4);
            pointer-events: none;
        }

        .tilt {
            position: relative;
            transform-style: preserve-3d;
            transform:
                translate3d(0, calc(var(--lift, 0) * -10px), calc(var(--lift, 0) * 40px))
                rotateX(calc(var(--rx, 0) * 1deg))
                rotateY(calc(var(--ry, 0) * 1deg));
            will-change: transform;
            animation: deal 1.1s cubic-bezier(.2, 1.35, .35, 1) backwards;
        }

        @keyframes deal {
            0%   { opacity: 0; transform: translate3d(0, 70vh, 0) rotateX(55deg) rotateZ(-14deg) scale(.8); }
            60%  { opacity: 1; }
            100% { opacity: 1; transform: translate3d(0, 0, 0) rotateX(0) rotateZ(0) scale(1); }
        }

        .flipper {
            position: relative;
            transform-style: preserve-3d;
            transition: transform .8s cubic-bezier(.3, 1.4, .4, 1);
        }

        .flipped .flipper { transform: rotateY(180deg); }

        .face {
            position: relative;
            background: #000;
            border-radius: 16px;
            padding: 28px;
            text-align: center;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            overflow: hidden;
            isolation: isolate;
        }

        /* Foil rim that shifts with the tilt */
        .face::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: conic-gradient(from calc(var(--ry, 0) * 8deg + var(--rx, 0) * 6deg),
                rgba(255,255,255,.08), rgba(255,255,255,.08) 20%,
                rgba(255,255,255,.55) 30%, rgba(170,200,255,.35) 35%,
                rgba(255,255,255,.08) 45%, rgba(255,255,255,.08) 70%,
                rgba(255,220,170,.4) 80%, rgba(255,255,255,.08) 90%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 3;
        }

        /* Periodic glint sweeping across the card */
        .face::after {
            content: '';
            position: absolute;
            inset: -40%;
            background: linear-gradient(115deg,
                transparent 42%,
                rgba(255,255,255,.0) 45%,
                rgba(255,255,255,.10) 49%,
                rgba(200,220,255,.16) 50%,
                rgba(255,255,255,.10) 51%,
                transparent 56%);
            transform: translateX(-60%);
            animation: glint 5.5s ease-in-out 1.3s infinite;
            pointer-events: none;
            mix-blend-mode: screen;
            z-index: 2;
        }

        @keyframes glint {
            0%   { transform: translateX(-60%); }
            35%, 100% { transform: translateX(60%); }
        }

        /* Glare that follows the pointer / phone tilt */
        .glare {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%),
                rgba(255,255,255,.14), rgba(255,255,255,.04) 30%, transparent 60%);
            opacity: calc(.25 + var(--lift, 0) * .75);
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 2;
        }

        .face > .content { position: relative; z-index: 1; }

        .back {
            position: absolute;
            inset: 0;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
        }

        .flipped .front, .back { pointer-events: none; }
        .flipped .back { pointer-events: auto; }

        .back .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .back .topbar { width: 100%; margin-bottom: 0; }

        .amp-logo { color: rgba(255, 255, 255, 0.35); line-height: 0; }
        .amp-logo svg { height: 22px; width: auto; display: inline-block; }

        .flip-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.03);
            color: rgba(255,255,255,.6);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: all .15s ease;
        }

        .flip-btn:hover, .flip-btn:focus-visible { color: #fff; border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.07); }
        .flip-btn svg { width: 16px; height: 16px; }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 4px auto 20px;
            overflow: hidden;
            display: block;
            transform: translateZ(30px);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%;
            display: block;
        }

        .name {
            font-family: 'Instrument Serif', serif;
            font-size: 38px;
            font-weight: 400;
            letter-spacing: -0.5px;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .title {
            font-size: 13px;
            color: rgba(255,255,255,.55);
            letter-spacing: .2px;
            margin-bottom: 24px;
        }

        .title b { color: rgba(255,255,255,.85); font-weight: 500; }

        .divider { height: 1px; background: rgba(255, 255, 255, 0.08); margin-bottom: 20px; }

        .socials {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: nowrap;
            justify-content: center;
        }

        .socials a {
            flex: 0 1 40px;
            min-width: 0;
            aspect-ratio: 1;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .socials a:hover, .socials a:focus-visible {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .socials svg { width: 16px; height: 16px; fill: currentColor; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.2px;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn.primary { background: #fff; color: #000; border-color: #fff; }
        .btn:hover, .btn:focus-visible { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }
        .btn.primary:hover, .btn.primary:focus-visible { background: rgba(255,255,255,.88); }
        .btn svg { width: 15px; height: 15px; }

        :focus-visible { outline: 2px solid rgba(255,255,255,.7); outline-offset: 2px; }

        .qr {
            width: 168px;
            height: 168px;
            padding: 14px;
            background: #fff;
            border-radius: 14px;
            transform: translateZ(30px);
        }

        .qr svg, .qr img { width: 100%; height: 100%; display: block; }

        .back .hint { font-size: 13px; color: rgba(255,255,255,.55); line-height: 1.5; }
        .back .url { font-size: 12px; color: rgba(255,255,255,.4); word-break: break-all; }

        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            transform: translate(-50%, 20px);
            background: #fff;
            color: #000;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 16px;
            border-radius: 999px;
            opacity: 0;
            transition: all .25s ease;
            pointer-events: none;
        }

        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        canvas.sparks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

        @media (max-width: 400px) {
            .face { padding: 22px; }
            .btn { padding: 12px 8px; gap: 6px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .tilt { animation: none; }
            .flipper { transition: none; }
            .face::after, body::before { animation: none; }
            .face::after { display: none; }
        }
    </style>
</head>

<script>
(() => {
    const CARD_URL = 'https://jimsteven.github.io/business-card/';
    const stage = document.getElementById('stage');
    const tilt = document.getElementById('tilt');
    const root = document.documentElement;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Reuse the front logo on the back.
    const backLogo = document.querySelector('.back .amp-logo svg');
    backLogo.innerHTML = document.querySelector('.front .amp-logo svg').innerHTML;

    // ---- Spring-driven tilt / lift --------------------------------------
    const MAX = 14;
    const s = { rx: 0, ry: 0, lift: 0, gx: 50, gy: 30 };
    const v = { rx: 0, ry: 0, lift: 0, gx: 0, gy: 0 };
    const t = { rx: 0, ry: 0, lift: 0, gx: 50, gy: 30 };
    let pointerActive = false, gyroActive = false, running = false, last = 0;

    function setTargetFromPoint(x, y) {
        const r = stage.getBoundingClientRect();
        const px = Math.min(Math.max((x - r.left) / r.width, 0), 1);
        const py = Math.min(Math.max((y - r.top) / r.height, 0), 1);
        t.ry = (px - .5) * 2 * MAX;
        t.rx = (.5 - py) * 2 * MAX;
        t.gx = px * 100;
        t.gy = py * 100;
        kick();
    }

    function apply() {
        tilt.style.setProperty('--rx', s.rx.toFixed(2));
        tilt.style.setProperty('--ry', s.ry.toFixed(2));
        stage.style.setProperty('--lift', s.lift.toFixed(3));
        stage.style.setProperty('--ry', s.ry.toFixed(2));
        tilt.style.setProperty('--gx', s.gx.toFixed(1) + '%');
        tilt.style.setProperty('--gy', s.gy.toFixed(1) + '%');
    }

    function step(now) {
        const dt = Math.min((now - last) / 1000, 1 / 30);
        last = now;
        let moving = false;
        for (const k in s) {
            // Under-damped spring so the card settles with a small bounce.
            const stiffness = k === 'lift' ? 120 : 170, damping = k === 'lift' ? 14 : 16;
            const a = stiffness * (t[k] - s[k]) - damping * v[k];
            v[k] += a * dt;
            s[k] += v[k] * dt;
            if (Math.abs(t[k] - s[k]) > .01 || Math.abs(v[k]) > .01) moving = true;
        }
        apply();
        if (moving) requestAnimationFrame(step); else running = false;
    }

    function kick() {
        if (reduce) { Object.assign(s, t); apply(); return; }
        if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
    }

    function release() {
        pointerActive = false;
        if (!gyroActive) { t.rx = 0; t.ry = 0; t.gx = 50; t.gy = 30; }
        t.lift = 0;
        kick();
    }

    stage.addEventListener('pointermove', e => {
        pointerActive = true;
        t.lift = 1;
        setTargetFromPoint(e.clientX, e.clientY);
        if (e.pointerType === 'mouse') sparkle(e.clientX, e.clientY, 1);
    });
    stage.addEventListener('pointerdown', e => {
        t.lift = 1;
        setTargetFromPoint(e.clientX, e.clientY);
        sparkle(e.clientX, e.clientY, 8);
    });
    stage.addEventListener('pointerleave', release);
    stage.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') release(); });
    stage.addEventListener('pointercancel', release);

    // ---- Phone tilt via gyroscope (iOS asks permission on first tap) ----
    let baseBeta = null;
    function onOrient(e) {
        if (e.beta == null || pointerActive) return;
        gyroActive = true;
        if (baseBeta === null) baseBeta = e.beta;
        const ry = Math.max(-1, Math.min(1, e.gamma / 30));
        const rx = Math.max(-1, Math.min(1, (baseBeta - e.beta) / 30));
        t.ry = ry * MAX;
        t.rx = rx * MAX;
        t.gx = 50 + ry * 50;
        t.gy = 50 - rx * 50;
        kick();
    }
    function enableGyro() {
        if (reduce || !('DeviceOrientationEvent' in window)) return;
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(r => { if (r === 'granted') addEventListener('deviceorientation', onOrient); })
                .catch(() => {});
        } else {
            addEventListener('deviceorientation', onOrient);
        }
    }
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        addEventListener('touchend', enableGyro, { once: true });
    } else {
        enableGyro();
    }

    // ---- Flip -----------------------------------------------------------
    const front = document.querySelector('.front');
    const back = document.querySelector('.back');
    document.querySelectorAll('[data-flip]').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        const flipped = tilt.classList.toggle('flipped');
        front.setAttribute('aria-hidden', flipped);
        back.setAttribute('aria-hidden', !flipped);
        front.querySelectorAll('a, button').forEach(el => el.tabIndex = flipped ? -1 : 0);
        back.querySelectorAll('a, button').forEach(el => el.tabIndex = flipped ? 0 : -1);
        (flipped ? back : front).querySelector('[data-flip]').focus({ preventScroll: true });
        const r = btn.getBoundingClientRect();
        sparkle(r.left + r.width / 2, r.top + r.height / 2, 18);
    }));

    // ---- Share ----------------------------------------------------------
    const toast = document.getElementById('toast');
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(showToast.t);
        showToast.t = setTimeout(() => toast.classList.remove('show'), 2200);
    }
    document.querySelectorAll('[data-share]').forEach(btn => btn.addEventListener('click', async () => {
        const data = { title: 'Jim Steven Espelico · Amp', text: 'Jim Steven Espelico — Co-founder, Operations Coordinator at Amp', url: CARD_URL };
        if (navigator.share) {
            try { await navigator.share(data); } catch (_) {}
            return;
        }
        try {
            await navigator.clipboard.writeText(CARD_URL);
            showToast('Card link copied');
        } catch (_) {
            prompt('Copy my card link:', CARD_URL);
        }
    }));

    // ---- Glitter particles ---------------------------------------------
    const cv = document.getElementById('sparks');
    const ctx = cv.getContext('2d');
    const parts = [];
    let sparkRunning = false;
    function resize() {
        const d = Math.min(devicePixelRatio || 1, 2);
        cv.width = innerWidth * d;
        cv.height = innerHeight * d;
        ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    resize();
    addEventListener('resize', resize);

    function sparkle(x, y, n) {
        if (reduce) return;
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 90;
            parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 1, size: 0.6 + Math.random() * 1.6, hue: Math.random() < .5 ? 210 : 40 });
        }
        if (!sparkRunning) { sparkRunning = true; let prev = performance.now(); requestAnimationFrame(function draw(now) {
            const dt = Math.min((now - prev) / 1000, 1 / 30); prev = now;
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            for (let i = parts.length - 1; i >= 0; i--) {
                const p = parts[i];
                p.life -= dt * 1.4;
                if (p.life <= 0) { parts.splice(i, 1); continue; }
                p.vy += 60 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = `hsl(${p.hue} 90% 85%)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (0.5 + p.life), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            if (parts.length) requestAnimationFrame(draw); else sparkRunning = false;
        }); }
    }

    // Small sparkle burst when the card lands after dealing in.
    if (!reduce) setTimeout(() => {
        const r = stage.getBoundingClientRect();
        sparkle(r.left + r.width / 2, r.top + 40, 24);
    }, 900);
})();
</script>

</body>
</html>
